[package]
name = "paganel-plugin-sdk"
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Rust SDK for Paganel plugins: transforms, filters, sources and sinks compiled to WASM"
repository = "https://github.com/stanstork/paganel"
homepage = "https://github.com/stanstork/paganel"
documentation = "https://docs.rs/paganel-plugin-sdk"
readme = "README.md"
keywords = ["wasm", "plugin", "etl", "database", "migration"]
categories = ["database", "wasm", "development-tools::ffi"]

[dependencies]
paganel-plugin-sdk-macros = { path = "../paganel-plugin-sdk-macros", version = "0.1.0" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.149"
bigdecimal = { version = "0.4.7", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.13.1", features = ["serde", "v4"] }
base64 = "0.22.1"
