[package]
name = "paganel-plugin-sdk-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Attribute macros for paganel-plugin-sdk: #[paganel_transform], #[paganel_filter], #[paganel_source], #[paganel_sink]"
repository = "https://github.com/stanstork/paganel"
homepage = "https://github.com/stanstork/paganel"
documentation = "https://docs.rs/paganel-plugin-sdk-macros"
readme = "README.md"
keywords = ["wasm", "plugin", "macros", "etl", "database"]
categories = ["database", "wasm", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
serde_json = "1.0.149"
