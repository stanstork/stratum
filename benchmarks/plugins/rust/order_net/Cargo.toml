[package]
name = "order_net"
version = "0.1.0"
edition = "2024"

# Compiled to wasm32-wasip1 by benchmarks/run.sh; excluded from the root
# workspace (see the root Cargo.toml `exclude`).
[lib]
crate-type = ["cdylib"]

[dependencies]
paganel-plugin-sdk = { path = "../../../../crates/sdk/paganel-plugin-sdk" }

[profile.release]
opt-level = 3
lto = true
